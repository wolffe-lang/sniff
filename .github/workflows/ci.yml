name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [trunk]
    paths: ['.github/**', 'ci/**', 'tools/**', 'wolf-toolchain.toml', 'sniff-oracle.toml']
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Optional job IDs, space-separated; empty runs the full release gate'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('sniff-{0}-{1}', github.head_ref, contains(github.event.pull_request.labels.*.name, 'full-matrix') && 'full' || 'pr') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # A trunk push runs the commit its pull request's run has just passed (merges
  # are fast-forwards), so the plan leaves it the macOS job already green there:
  # it reads this workflow's runs at the commit with the job's own token, which
  # may read the repository and its runs and nothing more. Each run names the
  # tree it tests in a step's name, where the jobs listing shows it; a pull
  # request's run tests its merge with the base.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      jobs: ${{ steps.plan.outputs.jobs }}
      covered: ${{ steps.plan.outputs.covered }}
    steps:
      - uses: actions/checkout@v4
      - name: the tree under test
        id: tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: the tree under test is ${{ steps.tree.outputs.tree }}
        run: test "$(git rev-parse 'HEAD^{tree}')" = "${{ steps.tree.outputs.tree }}"
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          IN_JOBS: ${{ inputs.jobs }}
          PLAN_TOKEN: ${{ github.token }}
        run: python3 -I ci/tiers.py plan --github-output "$GITHUB_OUTPUT"
  plan-test:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'plan-test') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/gate unit
  linux:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'linux') }}
    runs-on: ubuntu-24.04
    # The longest healthy run (23.1 minutes, 2026-11-24) with a slow snapshot mirror's apt step (22.4 minutes,
    # 2026-11-25) in place of its own (0.9), plus a third, rounded up to the next 5 minutes: 44.6 -> 59.5 -> 60.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/in-container
        env:
          SNIFF_ENGINE: docker
          SNIFF_CPUS: '0'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: linux-evidence
          path: |
            target/gate
            target/census/census.json
            target/fixtures/builds.json
            target/session
            target/values
  macos:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'macos') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # No hosted image carries the pinned macOS oracle binaries: the oracle
      # rows SKIP by name here and run in the Mac's local gauntlet record.
      - run: SNIFF_HOSTED_MACOS_CI=1 bash tools/gate macos
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: macos-evidence
          path: |
            target/gate
            target/census/census.json
            target/fixtures/builds.json
            target/session/record.json
            target/session/expected.json
            target/session/stdout.txt
            target/session/stderr.txt
            target/values
  tier:
    name: tier ${{ needs.plan.outputs.tier }}
    needs: [plan, plan-test, linux, macos]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I ci/tiers.py verdict
